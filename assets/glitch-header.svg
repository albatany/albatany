<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      <![CDATA[
      @keyframes flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
        20%, 22%, 24%, 55% { opacity: 0.45; }
      }
      @keyframes glitchTop {
        0%, 92%, 100% { transform: translate(0,0); opacity: 0; }
        92.5% { transform: translate(-4px,-2px); opacity: 0.85; }
        93.5% { transform: translate(3px,1px); opacity: 0.85; }
        94.5% { transform: translate(-2px,2px); opacity: 0.85; }
        95.5% { transform: translate(0,0); opacity: 0; }
      }
      @keyframes glitchBottom {
        0%, 90%, 100% { transform: translate(0,0); opacity: 0; }
        90.5% { transform: translate(4px,2px); opacity: 0.85; }
        91.5% { transform: translate(-3px,-1px); opacity: 0.85; }
        92.5% { transform: translate(2px,-2px); opacity: 0.85; }
        93.5% { transform: translate(0,0); opacity: 0; }
      }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .name-base { font-family: 'Courier New', monospace; font-weight: 700; font-size: 52px; fill: #00ff41; letter-spacing: 2px; filter: url(#glow); }
      .name-glitch1 { font-family: 'Courier New', monospace; font-weight: 700; font-size: 52px; fill: #ff2079; letter-spacing: 2px; animation: glitchTop 5s infinite; }
      .name-glitch2 { font-family: 'Courier New', monospace; font-weight: 700; font-size: 52px; fill: #05d9e8; letter-spacing: 2px; animation: glitchBottom 5s infinite; }
      .sub { font-family: 'Courier New', monospace; font-size: 17px; fill: #8ee6a8; animation: flicker 7s infinite; }
      .prompt { font-family: 'Courier New', monospace; font-size: 15px; fill: #4f7d5c; }
      .cursor { fill: #00ff41; animation: blink 1.1s steps(1) infinite; }
      .scan { fill: #00ff41; opacity: 0.035; }
      ]]>
    </style>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="220" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="220" fill="#0d0208"/>
    <g class="scan">
      <rect y="14" width="900" height="1"/>
      <rect y="38" width="900" height="1"/>
      <rect y="62" width="900" height="1"/>
      <rect y="86" width="900" height="1"/>
      <rect y="110" width="900" height="1"/>
      <rect y="134" width="900" height="1"/>
      <rect y="158" width="900" height="1"/>
      <rect y="182" width="900" height="1"/>
      <rect y="206" width="900" height="1"/>
    </g>

    <text x="46" y="60" class="prompt">root@albatany:~$ whoami</text>

    <text x="46" y="140" class="name-glitch1">AZIZ ALBATANY</text>
    <text x="46" y="140" class="name-glitch2">AZIZ ALBATANY</text>
    <text x="46" y="140" class="name-base">AZIZ ALBATANY</text>
    <rect class="cursor" x="474" y="98" width="15" height="46"/>

    <text x="48" y="177" class="sub">a.k.a AceBreaker — game dev · musician · pixel artist</text>
  </g>

  <rect x="1" y="1" width="898" height="218" rx="9" fill="none" stroke="#00ff41" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>
